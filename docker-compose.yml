services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: priyo_host
      POSTGRES_USER: priyo
      POSTGRES_PASSWORD: priyo
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U priyo -d priyo_host"], interval: 5s, timeout: 5s, retries: 10}
  app:
    build: .
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://priyo:priyo@db:5432/priyo_host
      SESSION_SECRET: local-development-secret-change-me
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin12345
      PUBLIC_BASE_URL: http://localhost:8080
      DATA_DIR: /data
      UPLOAD_MAX_BYTES: 104857600
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on: {db: {condition: service_healthy}}
    expose: ["3000"]
  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [app]
volumes: {pgdata: {}}

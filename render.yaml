services:
  - type: web
    name: priyo-codex-host
    env: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: priyo-codex-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DOCKER_HOST
        sync: false
databases:
  - name: priyo-codex-db
    plan: free
    databaseName: priyo_host
    user: priyo
